baseURL: https://jesusmarin.dev/
defaultContentLanguage: es
languageCode: es-VE
title: JesusMarin.Dev
theme: jmdev

pagination:
  pagerSize: 5

params:
  description: "Bienvenido a mi blog sobre programación y tecnología"
  dateFormat: "2-1-2006"
  author:
    email: contacto [ a T ] jesusmarin.dev
    name: Jesus Marin
  giscus:
    repo: jesusangelm/blog
    repoID: R_kgDOLo1yWA
    category: Comentarios
    categoryID: DIC_kwDOLo1yWM4Ce4ZC
    mapping: pathname
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: top
    theme: preferred_color_scheme
    lang: es
    loading: lazy

taxonomies:
  tag: tags

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

minify:
  minifyOutput: true
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false
  disableXML: false

enableRobotsTXT: true
enableGitInfo: true

menus:
  main:
    - name: Inicio
      pageRef: /
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 20
    - name: "Etiquetas"
      pageRef: /tags
      weight: 30
    - name: CV
      pageRef: /cv
      weight: 40