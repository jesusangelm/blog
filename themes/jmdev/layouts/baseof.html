<!DOCTYPE html>
<html class="h-100" data-bs-theme="auto" lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="d-flex flex-column h-100">
  <a class="visually-hidden-focusable" href="#main-content">{{ T "skip_to_content" }}</a>

  {{ partial "theme_toggle.html" . }}

  {{ partial "header.html" . }}
  <div id="main-content">
    {{ block "main" . }}{{ end }}
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
