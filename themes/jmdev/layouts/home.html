{{ define "main" }}
<main>
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        {{ .Content }}

        <h3 class="pb-4 mb-4 fst-italic border-bottom">
          {{ T "last_articles" }}
        </h3>

        <section>
          {{ range (first 3 (where .Site.RegularPages "Section" "blog" ).ByDate.Reverse) }}
            {{ partial "post_card.html" . }}
          {{ end }}
        </section>
      </div>
    </div>
  </div>
</main>
{{ end }}
