name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Hugo site
        env:
          HUGO_VERSION: "0.161.1"
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          chmod +x /usr/local/bin/hugo
          hugo --minify

  docker:
    needs: build
    runs-on: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.jesusmarin.dev
          username: ${{ github.repository_owner }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            git.jesusmarin.dev/${{ github.repository }}:latest
            git.jesusmarin.dev/${{ github.repository }}:sha-${{ github.sha }}
